name: static-checks

on:
  push:
    branches: [master, the-big-overhaul]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: realtime check
        run: tools/check_realtime.sh
      - name: save-isolation check
        run: tools/check_save_isolation.sh
      - name: TODO-issue check
        run: tools/check_todos.sh
